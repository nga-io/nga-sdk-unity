<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="stylesheet" href="unit.css" />
    <title>Ad</title>
  </head>
  <body>
    <main id="stage" aria-label="Advertisement">
      <video id="video" playsinline webkit-playsinline preload="auto" muted></video>
      <img id="endcard" alt="" hidden />
    </main>
    <div id="chrome" hidden>
      <div id="top">
        <div id="reward" class="pill" hidden></div>
        <div id="close-countdown" class="round" aria-hidden="true" hidden></div>
        <button id="close" class="round" type="button" aria-label="Close ad" hidden>&#x2715;</button>
      </div>
      <div id="bottom">
        <button id="mute" class="round" type="button" aria-label="Unmute ad" aria-pressed="true"></button>
        <button id="cta" type="button"></button>
        <button id="skip" class="pill" type="button" hidden></button>
      </div>
    </div>
    <script src="unit.js"></script>
  </body>
</html>
